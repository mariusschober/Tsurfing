name: Release (protected, manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "release" to confirm you intend to create a signed authorized release'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  checks: read

jobs:
  verify-release-source:
    runs-on: ubuntu-latest
    steps:
      - name: Require main with a green beta gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Authorized releases may only be dispatched from canonical main." >&2
            exit 1
          fi
          runs="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$GITHUB_SHA&per_page=100")"
          run_id="$(printf '%s' "$runs" | jq -r --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")][0].id // empty')"
          if [ -z "$run_id" ]; then
            echo "Commit $GITHUB_SHA does not have a successful Beta Gate push run on main." >&2
            exit 1
          fi
          jobs="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
          successful="$(printf '%s' "$jobs" | jq \
            '[.jobs[] | select(.name == "beta-gate" and .status == "completed" and .conclusion == "success")] | length')"
          if [ "$successful" -ne 1 ]; then
            echo "Main Beta Gate run $run_id does not contain exactly one successful beta-gate job." >&2
            exit 1
          fi
          echo "Release source verified: main at $GITHUB_SHA with main push beta-gate success in run $run_id."

  verify-signing-secrets:
    needs: verify-release-source
    runs-on: ubuntu-latest
    steps:
      - name: Validate all signing secrets present
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirm }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT_FINGERPRINT: ${{ secrets.EXPECTED_CERT_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CONFIRMATION" != "release" ]; then
            echo "Release confirmation must be exactly 'release'." >&2
            exit 1
          fi
          missing=0
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD EXPECTED_CERT_FINGERPRINT; do
            val="${!var}"
            if [ -z "$val" ]; then
              echo "Missing required signing secret: $var" >&2
              missing=1
            else
              echo "$var present"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "FAIL: all signing secrets must be present for release — failing closed" >&2
            exit 1
          fi
          echo "All signing secrets present"

  release:
    needs: verify-signing-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:migrations
      - run: node scripts/verify-migration-hashes.mjs
      - run: node scripts/verify-room-schema-hashes.mjs
      - name: Cache native Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-native-${{ hashFiles('android-native/**/*.gradle*', 'android-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-native-
      - name: Build signed native production release (requires all secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./android-native/gradlew -p android-native assembleProductionRelease --stacktrace --info
          ls -l android-native/app/build/outputs/apk/production/release/*.apk
      - name: Verify certificate fingerprint (fail closed)
        env:
          EXPECTED_CERT_FINGERPRINT: ${{ secrets.EXPECTED_CERT_FINGERPRINT }}
        run: |
          set -euo pipefail
          apk=$(find android-native/app/build/outputs/apk/production/release -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then echo "No release APK found" >&2; exit 1; fi
          # Find apksigner
          APKSIGNER=""
          for p in "$ANDROID_HOME/build-tools"/*/apksigner; do
            if [ -x "$p" ]; then APKSIGNER="$p"; break; fi
          done
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found" >&2; exit 1; fi
          certificate_output="$(mktemp)"
          trap 'rm -f "$certificate_output"' EXIT
          "$APKSIGNER" verify --verbose --print-certs "$apk" >"$certificate_output" 2>&1
          cat "$certificate_output"
          expected="$(printf '%s' "$EXPECTED_CERT_FINGERPRINT" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          mapfile -t signer_fingerprints < <(sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' "$certificate_output")
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "EXPECTED_CERT_FINGERPRINT must normalize to exactly 64 hexadecimal characters." >&2
            exit 1
          fi
          if [ "${#signer_fingerprints[@]}" -ne 1 ]; then
            echo "The release APK must contain exactly one signer certificate." >&2
            exit 1
          fi
          actual="$(printf '%s' "${signer_fingerprints[0]}" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if ! printf '%s' "$actual" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "apksigner did not report one valid SHA-256 signer fingerprint." >&2
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "Certificate fingerprint mismatch." >&2
            exit 1
          fi
          echo "Certificate fingerprint verified exactly."
          # Also run strict signing script which will FAIL if SKIP in release context
          ANDROID_EXPECT_SIGNED=1 bash android-native/scripts/verify-signing-strict.sh "$apk"
      - name: Create digests and provenance
        run: |
          set -euo pipefail
          apk=$(find android-native/app/build/outputs/apk/production/release -name '*.apk' -print -quit)
          [ -n "$apk" ] && [ -f "$apk" ] || { echo "No signed release APK found for provenance." >&2; exit 1; }
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
          echo "Provenance: $(git rev-parse HEAD) built at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$apk.provenance.txt"
          cat "$apk.provenance.txt"
          # Also for AAB if present
          aab=$(find android-native/app/build/outputs -name '*.aab' -print -quit)
          if [ -n "$aab" ]; then
            sha256sum "$aab" > "$aab.sha256"
            cat "$aab.sha256"
          fi
      - name: Upload signed release artifacts (authorized)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goalflow-signed-release
          path: |
            android-native/app/build/outputs/apk/production/release/*.apk
            android-native/app/build/outputs/apk/production/release/*.apk.sha256
            android-native/app/build/outputs/apk/production/release/*.apk.provenance.txt
            android-native/app/build/outputs/**/*.aab
            android-native/app/build/outputs/**/*.aab.sha256
          if-no-files-found: error

  release-gate:
    needs: [verify-release-source, verify-signing-secrets, release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check release gate
        run: |
          set -euo pipefail
          echo "verify-release-source=${{ needs.verify-release-source.result }} verify-signing-secrets=${{ needs.verify-signing-secrets.result }} release=${{ needs.release.result }}"
          if [ "${{ needs.verify-release-source.result }}" != "success" ]; then echo "verify-release-source failed" >&2; exit 1; fi
          if [ "${{ needs.verify-signing-secrets.result }}" != "success" ]; then echo "verify-signing-secrets failed" >&2; exit 1; fi
          if [ "${{ needs.release.result }}" != "success" ]; then echo "release failed" >&2; exit 1; fi
          echo "release-gate PASS"
